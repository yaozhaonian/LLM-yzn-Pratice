{% extends "base.html" %}

{% block content %}
<div class="chat-page">
    <div class="chat-sidebar">
        <h3>📚 知识库</h3>
        <select id="knowledgeSelect">
            {% for name, info in knowledge_bases.items() %}
            <option value="{{ name }}">{{ info.name }} ({{ info.document_count }}文档)</option>
            {% endfor %}
        </select>
        
        <div class="knowledge-info">
            <h4>文件列表</h4>
            <ul id="fileList"></ul>
        </div>
    </div>
    
    <div class="chat-main">
        <div class="chat-messages" id="chatMessages">
            <div class="message system">
                <div class="message-content">
                    你好！我是 AI 助手，请选择知识库后开始提问。
                </div>
            </div>
        </div>
        
        <div class="chat-input">
            <textarea id="chatInput" placeholder="输入问题，按 Enter 发送..." rows="3"></textarea>
            <button id="sendBtn" class="btn btn-primary">发送</button>
        </div>
        
        <div class="loading" id="loading" style="display: none;">
            <span>🤔 正在思考...</span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const knowledgeSelect = document.getElementById('knowledgeSelect');
const loading = document.getElementById('loading');
const fileList = document.getElementById('fileList');

// 发送消息
async function sendMessage() {
    const query = chatInput.value.trim();
    const knowledgeName = knowledgeSelect.value;
    
    if (!query || !knowledgeName) return;
    
    addMessage(query, 'user');
    chatInput.value = '';
    loading.style.display = 'block';
    sendBtn.disabled = true;
    
    try {
        const formData = new FormData();
        formData.append('query', query);
        formData.append('knowledge_name', knowledgeName);
        
        const response = await fetch('/api/chat', {
            method: 'POST',
            body: formData
        });
        
        if (response.ok) {
            const result = await response.json();
            
            // 显示检索到的来源
            if (result.sources && result.sources.length > 0) {
                console.log('📋 检索来源:', result.sources);
                console.log('📋 检索结果:', result.search_results);
            }
            
            addMessage(result.answer, 'assistant');
        } else {
            throw new Error('请求失败');
        }
    } catch (error) {
        addMessage('抱歉，出现错误：' + error.message, 'system');
    } finally {
        loading.style.display = 'none';
        sendBtn.disabled = false;
    }
}

// 添加消息到聊天框
function addMessage(content, type) {
    const div = document.createElement('div');
    div.className = `message ${type}`;
    div.innerHTML = `<div class="message-content">${content}</div>`;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

// 事件监听
sendBtn.addEventListener('click', sendMessage);

chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

// 知识库切换
knowledgeSelect.addEventListener('change', () => {
    // 可以加载该知识库的文件列表
    fileList.innerHTML = '<li>已切换知识库</li>';
});
</script>
{% endblock %}
