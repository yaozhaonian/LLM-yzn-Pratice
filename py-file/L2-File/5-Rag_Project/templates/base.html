<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RAG 知识库问答系统{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🤖 RAG 知识库</div>
        <div class="nav-links">
            <a href="/" class="nav-link">主页</a>
            <a href="/upload" class="nav-link">资料上传</a>
            <a href="/chat" class="nav-link {% if not has_knowledge %}disabled{% endif %}">AI 问答</a>
        </div>
    </nav>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
