{% extends "base.html" %}

{% block content %}
<div class="upload-page">
    <h1>📁 资料上传</h1>

    <div class="upload-form">
        <div class="form-group">
            <label for="knowledge_name">知识库名称</label>
            <input type="text" id="knowledge_name" placeholder="输入知识库名称（2-50 个字符）" minlength="2" maxlength="50"
                required>
            <small class="hint">支持中文，系统将自动处理</small>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <p>点击或拖拽文件到此处上传</p>
            <p class="hint">支持 .txt, .pdf, .docx, .json, .md 格式，单个文件最大 10MB</p>
            <p class="warning">⚠️ 注意：.doc 旧版 Word 格式不支持，请另存为 .docx</p>
            <input type="file" id="fileInput" multiple accept=".txt,.pdf,.docx,.json,.md" hidden>
        </div>
        <!-- templates/upload.html 中添加提示 -->

        <div class="file-list" id="fileList"></div>

        <button id="uploadBtn" class="btn btn-primary" disabled>生成知识库</button>

        <div class="progress-bar" id="progressBar" style="display: none;">
            <div class="progress-fill" id="progressFill"></div>
            <span id="progressText">正在处理...</span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const uploadBtn = document.getElementById('uploadBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');

    let selectedFiles = [];

    // 点击上传
    uploadArea.addEventListener('click', () => fileInput.click());

    // 文件选择
    fileInput.addEventListener('change', (e) => {
        selectedFiles = [...e.target.files];
        updateFileList();
    });

    // 拖拽上传
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        selectedFiles = [...e.dataTransfer.files];
        updateFileList();
    });

    function updateFileList() {
        if (selectedFiles.length === 0) {
            uploadBtn.disabled = true;
            fileList.innerHTML = '';
            return;
        }

        uploadBtn.disabled = false;
        fileList.innerHTML = selectedFiles.map(f =>
            `<div class="file-item">📄 ${f.name} (${(f.size / 1024).toFixed(1)} KB)</div>`
        ).join('');
    }

    // 上传
    uploadBtn.addEventListener('click', async () => {
        const knowledgeName = document.getElementById('knowledge_name').value;
        if (!knowledgeName) {
            alert('请输入知识库名称');
            return;
        }

        // 2. 构建 FormData（表单数据）
        const formData = new FormData();
        formData.append('knowledge_name', knowledgeName);
        selectedFiles.forEach(f => formData.append('files', f));

        progressBar.style.display = 'block';
        uploadBtn.disabled = true;

        try {
            // 模拟进度
            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                progressFill.style.width = progress + '%';
                if (progress >= 90) clearInterval(interval);
            }, 200);

            const response = await fetch('/api/upload', {
                method: 'POST',
                body: formData
            });

            clearInterval(interval);
            progressFill.style.width = '100%';

            if (response.ok) {
                const result = await response.json();
                progressText.textContent = '✓ 知识库创建成功！';

                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } else {
                throw new Error('上传失败');
            }
        } catch (error) {
            alert('上传失败：' + error.message);
            progressBar.style.display = 'none';
            uploadBtn.disabled = false;
        }
    });
</script>
{% endblock %}
